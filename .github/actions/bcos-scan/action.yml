name: "BCOS Scan"
description: "Reusable GitHub Action to scan, score, comment, and attest repos via BCOS v2"
author: "RustChain BCOS"

inputs:
  tier:
    description: "Review tier (L0, L1, L2)"
    required: false
    default: "L1"
  reviewer:
    description: "GitHub login of the assigned reviewer"
    required: false
    default: ""
  node-url:
    description: "RustChain node URL used for BCOS verification and attestation anchoring"
    required: false
    default: "https://rustchain.org"
  pr-number:
    description: "PR number to comment on (defaults to current PR)"
    required: false
    default: ""
  repo-token:
    description: "GitHub token for PR comments; defaults to github.token when available"
    required: false
    default: ""
  engine-url:
    description: "Raw URL for tools/bcos_engine.py"
    required: false
    default: "https://raw.githubusercontent.com/Scottcjn/Rustchain/main/tools/bcos_engine.py"

outputs:
  trust_score:
    description: "BCOS trust score (0-100)"
    value: ${{ steps.scan.outputs.trust_score }}
  cert_id:
    description: "BCOS attestation certificate ID"
    value: ${{ steps.scan.outputs.cert_id }}
  tier_met:
    description: "Whether the required tier was met (true/false)"
    value: ${{ steps.scan.outputs.tier_met }}

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_REVIEWER: ${{ inputs.reviewer }}
        INPUT_NODE_URL: ${{ inputs.node-url }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPO_TOKEN: ${{ inputs.repo-token }}
        INPUT_ENGINE_URL: ${{ inputs.engine-url }}
        ACTION_GITHUB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/entrypoint.sh
      working-directory: ${{ github.workspace }}
