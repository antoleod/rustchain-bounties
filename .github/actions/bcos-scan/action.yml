name: "BCOS v2 Scan"
description: "Run the official BCOS v2 engine, report results, and anchor merged attestations"
author: "RustChain BCOS"

inputs:
  tier:
    description: "Certification tier: L0, L1, or L2"
    required: false
    default: "L1"
  reviewer:
    description: "Human reviewer handle (required by the engine for L2)"
    required: false
    default: ""
  node-url:
    description: "RustChain node base URL used to anchor merged attestations"
    required: false
    default: "https://rustchain.org"
  github-token:
    description: "Token used to create or update the pull-request comment"
    required: false
    default: ${{ github.token }}

outputs:
  trust_score:
    description: "BCOS trust score (0-100)"
    value: ${{ steps.bcos.outputs.trust_score }}
  cert_id:
    description: "BCOS attestation certificate ID"
    value: ${{ steps.bcos.outputs.cert_id }}
  tier_met:
    description: "Whether the required tier was met (true/false)"
    value: ${{ steps.bcos.outputs.tier_met }}

runs:
  using: "composite"
  steps:
    - id: bcos
      shell: bash
      env:
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_REVIEWER: ${{ inputs.reviewer }}
        INPUT_NODE_URL: ${{ inputs.node-url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "${{ github.action_path }}/main.py"

branding:
  icon: "shield"
  color: "blue"
